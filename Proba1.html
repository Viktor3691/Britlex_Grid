<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proba-Britlex</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="./styles/style_proba.css">
</head>
<body>

<!-- HEADER -->

<heder class="heder" id="home">
    <div class="container-alignment">
        <div class="container">
            <div class="header__flex-box">
                <div class="header__logo-box">
                    <img class="logo-file" src="./images/logo_Britlex.svg" alt="logo">
                </div><!-- .header__logo-box -->

                <div class="nav-bar-box">
                    <ul class="nav-bar">
                                <li class="nav-bar-item">
                                <a class="nav-bar-link button__style" href="#home"><ya-tr-span
                                data-index="0-0"
                                data-translated="false"
                                data-source-lang="en"
                                data-target-lang="ru"
                                data-value="Home"
                                data-translation="Главная"
                                data-ch="0"
                                data-type="trSpan"
                                style="visibility: inherit !important;">
                                Home</ya-tr-span></a></li>

                                <li class="nav-bar-item">
                                <a class="nav-bar-link  button__style"           href="#skills"><ya-tr-span
                                data-index="0-1"
                                data-translated="false"
                                data-source-lang="en"
                                data-target-lang="ru"
                                data-value="Skills"
                                data-translation="Навыки"
                                data-ch="0" data-type="trSpan"
                                style="visibility: inherit !important;">
                                Skills</ya-tr-span></a></li>

                        <li class="nav-bar-item">
                            <a class="nav-bar-link button__style"
                                href="#about us"><ya-tr-span
                                data-index="0-2"
                                data-translated="false"
                                data-source-lang="en"
                                data-target-lang="ru"
                                data-value="About Us"
                                data-translation="О нас"
                                data-ch="0"
                                data-type="trSpan"
                                style="visibility: inherit !important;">
                                About Us</ya-tr-span></a></li>


                        <li class="nav-bar-item">

                        </li>


                        <li class="nav-bar-item">

                        </li>
                    </ul>

                </div><!-- nav-bar-box -->
            </div><!-- .header__flex-box -->
        </div><!-- container -->
    </div><!-- container-alignment -->
</heder>




</body>
</html>
